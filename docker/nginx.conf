server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively — filenames are content-hashed by the build
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|whl|gz)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes (/, /tiktok, /activitywatch, etc.) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
