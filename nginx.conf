# Host nginx config — reverse proxy to the Docker container.
# Deploy: copy to /etc/nginx/sites-available/datadonation, symlink to sites-enabled,
# then run: certbot --nginx -d datadonation.digital-kaleidoscope.org

server {
    listen 80;
    server_name datadonation.digital-kaleidoscope.org;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
